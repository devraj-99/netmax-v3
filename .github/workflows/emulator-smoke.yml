name: Emulator Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    name: Install APK on emulator and capture UI evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download release APK
        run: |
          APK_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/devraj-99/netmax-v3/releases/latest | jq -r '.assets[0].browser_download_url')
          echo "APK_URL=$APK_URL"
          curl -L --fail -o app.apk "$APK_URL"
          ls -la app.apk

      - name: Generate test video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -y -loglevel error -f lavfi -i testsrc=duration=120:size=640x360:rate=30 -f lavfi -i sine=frequency=440:duration=120 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest netmax_aaa_first.mp4
          ffmpeg -y -loglevel error -f lavfi -i testsrc=duration=15:size=640x360:rate=30 -f lavfi -i sine=frequency=880:duration=15 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest netmax_zzz_second.mp4
          cp netmax_zzz_second.mp4 netmax_local_test.mp4
          ls -la netmax_local_test.mp4

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -x
            adb install -r app.apk
            adb push netmax_aaa_first.mp4 /sdcard/Movies/netmax_aaa_first.mp4
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Movies/netmax_aaa_first.mp4 || true
            sleep 3
            adb push netmax_zzz_second.mp4 /sdcard/Movies/netmax_zzz_second.mp4
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Movies/netmax_zzz_second.mp4 || true
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Movies/netmax_aaa_first.mp4 || true
            sleep 3
            adb push netmax_local_test.mp4 /sdcard/Movies/netmax_local_test.mp4
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Movies/netmax_local_test.mp4 || true
            sleep 8
            adb shell pm grant com.nuvio.app android.permission.READ_MEDIA_VIDEO || true
            adb shell content query --uri content://media/external/video/media --projection _display_name || true
            adb shell settings put global window_animation_scale 0; adb shell settings put global transition_animation_scale 0; adb shell settings put global animator_duration_scale 0
            adb shell am start -n com.nuvio.app/.MainActivity
            sleep 20
            for TRY in 1 2 3 4 5 6 7 8; do adb shell uiautomator dump /sdcard/ui1.xml >/dev/null 2>&1; adb pull /sdcard/ui1.xml ui1.xml >/dev/null 2>&1; if grep -q "Continue Without Account" ui1.xml; then echo "login gate visible on try $TRY"; break; fi; python3 .github/scripts/tap_text.py ui1.xml "Wait" || true; sleep 12; adb shell am start -n com.nuvio.app/.MainActivity >/dev/null 2>&1; sleep 15; done; grep -q "Continue Without Account" ui1.xml || { echo "FATAL: login gate never appeared"; exit 1; }
            adb exec-out screencap -p > shot_1_launch.png
            python3 .github/scripts/tap_text.py ui1.xml "Continue Without Account"
            sleep 12
            adb exec-out screencap -p > shot_1b_after_login.png
            for TRY in 1 2 3 4; do adb shell uiautomator dump /sdcard/ui1b.xml >/dev/null 2>&1; adb pull /sdcard/ui1b.xml ui1b.xml >/dev/null 2>&1; if grep -q "Who's watching?" ui1b.xml; then break; fi; sleep 6; done; grep -q "Who's watching?" ui1b.xml || { echo "FATAL: profile picker never appeared"; exit 1; }
            python3 .github/scripts/tap_text.py ui1b.xml @clickable:0
            sleep 15
            adb exec-out screencap -p > shot_1c_home.png
            adb shell uiautomator dump /sdcard/ui1c.xml && adb pull /sdcard/ui1c.xml ui1c.xml || true
            python3 .github/scripts/tap_text.py ui1c.xml "Add Profile" || true
            sleep 8
            adb exec-out screencap -p > shot_1d_addprofile.png
            adb shell uiautomator dump /sdcard/ui1d.xml && adb pull /sdcard/ui1d.xml ui1d.xml || true
            python3 .github/scripts/tap_text.py ui1d.xml "Profile name" || true
            sleep 2
            adb shell input text "Smoke" || true
            sleep 2
            adb shell input keyevent KEYCODE_BACK || true
            sleep 2
            adb shell uiautomator dump /sdcard/ui1d2.xml && adb pull /sdcard/ui1d2.xml ui1d2.xml || true
            python3 .github/scripts/tap_text.py ui1d2.xml "Create Profile"
            sleep 10
            adb exec-out screencap -p > shot_1e_home.png
            adb shell uiautomator dump /sdcard/ui1e.xml && adb pull /sdcard/ui1e.xml ui1e.xml || true
            python3 .github/scripts/tap_text.py ui1e.xml "Library" || python3 .github/scripts/tap_text.py ui1e.xml "Smoke"
            sleep 10
            adb shell uiautomator dump /sdcard/ui1f.xml && adb pull /sdcard/ui1f.xml ui1f.xml || true
            python3 .github/scripts/tap_text.py ui1f.xml "Library" || true
            sleep 8
            adb exec-out screencap -p > shot_2_library.png
            adb shell uiautomator dump /sdcard/ui2.xml && adb pull /sdcard/ui2.xml ui2.xml || true
            python3 .github/scripts/tap_text.py ui2.xml "Local"
            sleep 10
            adb exec-out screencap -p > shot_3_local_tab.png
            adb shell uiautomator dump /sdcard/ui3.xml && adb pull /sdcard/ui3.xml ui3.xml || true
            for TRY in 1 2 3; do if grep -q "netmax_zzz_second" ui3.xml; then break; fi; adb shell uiautomator dump /sdcard/ui3.xml >/dev/null 2>&1; adb pull /sdcard/ui3.xml ui3.xml >/dev/null 2>&1; sleep 6; done
            adb logcat -c || true
            python3 .github/scripts/tap_text.py ui3.xml "netmax_aaa_first"
            sleep 15
            adb exec-out screencap -p > shot_4_playback.png
            adb shell dumpsys media.audio_flinger > audioflinger.txt 2>&1 || true
            echo "=== audioflinger during playback: sessions ==="
            grep -iE "session|standby" audioflinger.txt | head -25 || true
            echo "=== audioflinger during playback: effects ==="
            grep -iE "equalizer|bass|virtualizer|Effect|effect" audioflinger.txt | head -40 || true
            adb shell uiautomator dump /sdcard/ui4.xml && adb pull /sdcard/ui4.xml ui4.xml || true
            python3 .github/scripts/tap_text.py ui4.xml "Got it" || true
            sleep 3
            adb shell input tap 1200 540 || true
            sleep 3
            adb shell uiautomator dump /sdcard/ui4a2.xml && adb pull /sdcard/ui4a2.xml ui4a2.xml || true
            adb shell input tap 1200 540 || true
            sleep 2
            adb exec-out screencap -p > shot_4c0_controls.png
            sleep 4
            adb shell input tap 1200 540 || true
            sleep 1
            adb shell input tap 1738 135
            sleep 3
            adb exec-out screencap -p > shot_4c_equalizer.png
            adb shell uiautomator dump /sdcard/ui4eq.xml && adb pull /sdcard/ui4eq.xml ui4eq.xml || true
            adb shell input tap 2150 380 || true
            sleep 1
            adb shell input swipe 1200 800 1700 800 600 || true
            sleep 1
            adb exec-out screencap -p > shot_4c2_eq_adjusted.png
            sleep 4
            adb shell input tap 1200 540 || true
            sleep 1
            adb shell input tap 1626 135
            sleep 6
            adb shell input tap 1200 540 || true
            sleep 3
            adb exec-out screencap -p > shot_4b_reel_mode.png
            adb shell uiautomator dump /sdcard/ui4c.xml && adb pull /sdcard/ui4c.xml ui4c.xml || true
            adb logcat -d | grep -i AudioEqualizer || echo "NO AudioEqualizer warnings in logcat (attach path threw nothing)"
            adb shell input keyevent KEYCODE_BACK || true
            sleep 4
            adb shell uiautomator dump /sdcard/ui4d.xml && adb pull /sdcard/ui4d.xml ui4d.xml || true
            python3 .github/scripts/tap_text.py ui4d.xml "netmax_zzz_second"
            sleep 17
            adb exec-out screencap -p > shot_4e_autonext.png
            adb shell uiautomator dump /sdcard/ui4e.xml && adb pull /sdcard/ui4e.xml ui4e.xml || true
            adb exec-out screencap -p > shot_4e2_before_home.png
            adb shell input keyevent KEYCODE_HOME
            sleep 5
            adb shell dumpsys media_session > ms_bg1.txt 2>&1 || true
            echo "=== media_session backgrounded t+5s ==="
            grep -iE "nuvio|state=|position=" ms_bg1.txt | head -20 || true
            sleep 5
            adb shell dumpsys media_session > ms_bg2.txt 2>&1 || true
            echo "=== media_session backgrounded t+10s ==="
            grep -iE "nuvio|state=|position=" ms_bg2.txt | head -20 || true
            cp ms_bg1.txt shot_4f1_ms_bg1.txt 2>/dev/null || true
            cp ms_bg2.txt shot_4f2_ms_bg2.txt 2>/dev/null || true
            adb shell am start -n com.nuvio.app/.MainActivity >/dev/null 2>&1
            sleep 5
            adb exec-out screencap -p > shot_4g_background_return.png
            adb shell input keyevent KEYCODE_BACK || true
            sleep 3
            adb shell dumpsys media.audio_flinger > audioflinger.txt 2>&1 || true
            echo "=== audio sessions in playback tracks ==="
            grep -iE "session" audioflinger.txt | head -20 || true
            echo "=== effect chains ==="
            grep -iE "equalizer|bass|virtualizer|effect" audioflinger.txt | head -30 || true
            cp audioflinger.txt shot_4d_audioflinger.txt 2>/dev/null || true
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell content query --uri content://media/external/video/media --projection _id > vidq.txt 2>&1; cat vidq.txt; VID=$(grep -o '_id=[0-9]*' vidq.txt | tail -1 | cut -d= -f2); echo "MEDIA_ID=$VID"; if [ -n "$VID" ]; then adb shell am start -a android.intent.action.VIEW -d "content://media/external/video/media/$VID" -t "video/*"; fi
            sleep 8
            adb exec-out screencap -p > shot_5_openwith_picker.png
            adb shell uiautomator dump /sdcard/ui5.xml && adb pull /sdcard/ui5.xml ui5.xml || true
            python3 .github/scripts/tap_text.py ui5.xml "NetMax" || python3 .github/scripts/tap_text.py ui5.xml "NETMAX" || true
            sleep 3
            adb shell uiautomator dump /sdcard/ui6.xml && adb pull /sdcard/ui6.xml ui6.xml || true
            python3 .github/scripts/tap_text.py ui6.xml "Just once" || true
            for TRY in 1 2 3; do sleep 4; adb shell uiautomator dump /sdcard/ui6r.xml >/dev/null 2>&1; adb pull /sdcard/ui6r.xml ui6r.xml >/dev/null 2>&1 || true; if ! grep -q "Just once" ui6r.xml 2>/dev/null; then echo "chooser dispatched on try $TRY"; break; fi; echo "chooser still open, retrying Just once (try $TRY)"; python3 .github/scripts/tap_text.py ui6r.xml "Just once" || true; done
            sleep 25
            adb shell dumpsys activity activities | grep -E "topResumedActivity|ResumedActivity" | head -3 || true
            adb exec-out screencap -p > shot_6_openwith_player.png
            adb shell uiautomator dump /sdcard/ui6b.xml && adb pull /sdcard/ui6b.xml ui6b.xml || true
            adb shell dumpsys activity top | grep -i -m3 nuvio || true
            adb logcat -d > logcat_full.txt 2>&1 || true
            cp ms_bg1.txt ms_bg2.txt audioflinger.txt . 2>/dev/null || true
            echo SMOKE_DONE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: |
            shot_*.png
            ui*.xml
            *.txt
          retention-days: 30
