name: Emulator Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    name: Install APK on emulator and capture UI evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download release APK
        run: |
          APK_URL=$(curl -s https://api.github.com/repos/devraj-99/netmax-v3/releases/latest | jq -r '.assets[0].browser_download_url')
          echo "APK_URL=$APK_URL"
          curl -L --fail -o app.apk "$APK_URL"
          ls -la app.apk

      - name: Generate test video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -y -loglevel error -f lavfi -i testsrc=duration=8:size=640x360:rate=30 -f lavfi -i sine=frequency=440:duration=8 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest netmax_local_test.mp4
          ls -la netmax_local_test.mp4

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -x
            adb install -r app.apk
            adb push netmax_local_test.mp4 /sdcard/Movies/netmax_local_test.mp4
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Movies/netmax_local_test.mp4 || true
            sleep 8
            adb shell pm grant com.nuvio.app android.permission.READ_MEDIA_VIDEO || true
            adb shell content query --uri content://media/external/video/media --projection _display_name || true
            adb shell monkey -p com.nuvio.app -c android.intent.category.LAUNCHER 1
            sleep 30
            adb exec-out screencap -p > shot_1_launch.png
            adb shell uiautomator dump /sdcard/ui1.xml && adb pull /sdcard/ui1.xml ui1.xml || true
            python3 .github/scripts/tap_text.py ui1.xml "Continue Without Account" || true
            sleep 12
            adb exec-out screencap -p > shot_1b_after_login.png
            adb shell uiautomator dump /sdcard/ui1b.xml && adb pull /sdcard/ui1b.xml ui1b.xml || true
            python3 .github/scripts/tap_text.py ui1b.xml @clickable:0 || true
            sleep 15
            adb exec-out screencap -p > shot_1c_home.png
            adb shell uiautomator dump /sdcard/ui1c.xml && adb pull /sdcard/ui1c.xml ui1c.xml || true
            python3 .github/scripts/tap_text.py ui1c.xml "Add Profile" || true
            sleep 8
            adb exec-out screencap -p > shot_1d_addprofile.png
            adb shell uiautomator dump /sdcard/ui1d.xml && adb pull /sdcard/ui1d.xml ui1d.xml || true
            python3 .github/scripts/tap_text.py ui1d.xml "Save" || python3 .github/scripts/tap_text.py ui1d.xml "Create" || python3 .github/scripts/tap_text.py ui1d.xml "Done" || python3 .github/scripts/tap_text.py ui1d.xml "Continue" || true
            sleep 6
            adb shell uiautomator dump /sdcard/ui1e.xml && adb pull /sdcard/ui1e.xml ui1e.xml || true
            python3 .github/scripts/tap_text.py ui1e.xml @clickable:0 || true
            sleep 10
            adb exec-out screencap -p > shot_1e_home.png
            adb shell uiautomator dump /sdcard/ui1f.xml && adb pull /sdcard/ui1f.xml ui1f.xml || true
            python3 .github/scripts/tap_text.py ui1f.xml "Library" || true
            sleep 8
            adb exec-out screencap -p > shot_2_library.png
            adb shell uiautomator dump /sdcard/ui2.xml && adb pull /sdcard/ui2.xml ui2.xml || true
            python3 .github/scripts/tap_text.py ui2.xml "Local" || true
            sleep 10
            adb exec-out screencap -p > shot_3_local_tab.png
            adb shell uiautomator dump /sdcard/ui3.xml && adb pull /sdcard/ui3.xml ui3.xml || true
            python3 .github/scripts/tap_text.py ui3.xml "netmax_local_test" || true
            sleep 15
            adb exec-out screencap -p > shot_4_playback.png
            adb shell uiautomator dump /sdcard/ui4.xml && adb pull /sdcard/ui4.xml ui4.xml || true
            adb shell input tap 540 1200 || true
            sleep 3
            adb shell uiautomator dump /sdcard/ui4b.xml && adb pull /sdcard/ui4b.xml ui4b.xml || true
            python3 .github/scripts/tap_text.py ui4b.xml "Reel mode" || true
            sleep 6
            adb exec-out screencap -p > shot_4b_reel_mode.png
            adb shell uiautomator dump /sdcard/ui4c.xml && adb pull /sdcard/ui4c.xml ui4c.xml || true
            python3 .github/scripts/tap_text.py ui4c.xml "Equalizer" || true
            sleep 4
            adb exec-out screencap -p > shot_4c_equalizer.png
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell content query --uri content://media/external/video/media --projection _id || true
            VID=$(adb shell content query --uri content://media/external/video/media --projection _id | grep -o '_id=[0-9]*' | tail -1 | cut -d= -f2) || true
            echo "MEDIA_ID=$VID"
            if [ -n "$VID" ]; then adb shell am start -a android.intent.action.VIEW -d "content://media/external/video/media/$VID" -t "video/*" || true; fi
            sleep 8
            adb exec-out screencap -p > shot_5_openwith_picker.png
            adb shell uiautomator dump /sdcard/ui5.xml && adb pull /sdcard/ui5.xml ui5.xml || true
            python3 .github/scripts/tap_text.py ui5.xml "NetMax" || python3 .github/scripts/tap_text.py ui5.xml "NETMAX" || true
            sleep 15
            adb exec-out screencap -p > shot_6_openwith_player.png
            adb shell uiautomator dump /sdcard/ui6.xml && adb pull /sdcard/ui6.xml ui6.xml || true
            echo SMOKE_DONE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: |
            shot_*.png
            ui*.xml
          retention-days: 30
