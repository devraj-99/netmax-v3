name: Compile Check (no package)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Provide optional runtime config file for compile
        run: touch local.properties

      - name: Discover Android Kotlin compile task
        id: discover
        run: |
          ./gradlew -Pnuvio.android.distribution=full :composeApp:tasks --all --console=plain > tasks.txt
          { grep -oE '^compile[A-Za-z0-9]*Kotlin[A-Za-z0-9]*\b' tasks.txt || true; } | sort -u | tee compile-tasks.txt
          TASK=''
          for candidate in compileAndroidMain compileAndroidMainKotlin compileKotlinAndroid compileDebugKotlinAndroid compileAndroidMainKotlinAndroid; do
           if grep -qx "$candidate" tasks.txt || grep -qE "^${candidate}([[:space:]]|$)" tasks.txt; then TASK=$candidate; break; fi
          done
          if [ -z "$TASK" ]; then
           TASK=$(grep -iE '^compile[A-Za-z0-9]*Kotlin[A-Za-z0-9]*Android[A-Za-z0-9]*$' compile-tasks.txt | grep -viE 'test|ios|metadata' | head -1 || true)
          fi
          if [ -z "$TASK" ]; then echo 'No supported Android Kotlin compile task found'; cat tasks.txt; exit 1; fi
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "Selected task: $TASK"

      - name: Verify task graph contains no packaging
        run: |
          ./gradlew -Pnuvio.android.distribution=full ":composeApp:${{ steps.discover.outputs.task }}" --dry-run --console=plain | tee dryrun.txt
          # Resource preparation is required for Kotlin's generated R references;
          # it creates no APK/AAR. Keep all other packaging forbidden.
          grep -vE '^:composeApp:packageAndroidMainResources ' dryrun.txt > guarded-dryrun.txt
          if grep -iqE '^:[^ ]*(assemble|package|bundle|apk|aar)' guarded-dryrun.txt; then
            echo 'GRAPH CONTAINS PACKAGING TASK - ABORTING before any execution'
            grep -iE '^:[^ ]*(assemble|package|bundle|apk|aar)' guarded-dryrun.txt
            exit 1
          fi
          echo 'Graph clean: no APK/AAR packaging; compile resource preparation only'

      - name: Compile (Kotlin only, no assemble/package)
        run: ./gradlew -Pnuvio.android.distribution=full ":composeApp:${{ steps.discover.outputs.task }}" --no-daemon --console=plain
