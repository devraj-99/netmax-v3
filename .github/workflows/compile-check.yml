name: Compile Check (no package)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Discover Android Kotlin compile task
        id: discover
        run: |
          ./gradlew :composeApp:tasks --all --console=plain > tasks.txt
          grep -oE '^compile[A-Za-z0-9]*KotlinAndroid\b' tasks.txt | sort -u | tee compile-tasks.txt
          if grep -qx 'compileDebugKotlinAndroid' compile-tasks.txt; then
            TASK=compileDebugKotlinAndroid
          else
            TASK=$(grep -i 'debug' compile-tasks.txt | head -1 || true)
          fi
          if [ -z "${TASK:-}" ]; then echo 'NO compile*KotlinAndroid task found'; exit 1; fi
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "Selected task: $TASK"

      - name: Verify task graph contains no packaging
        run: |
          ./gradlew ":composeApp:${{ steps.discover.outputs.task }}" --dry-run --console=plain | tee dryrun.txt
          if grep -iqE '^:[^ ]*(assemble|package|bundle|apk|aar)' dryrun.txt; then
            echo 'GRAPH CONTAINS PACKAGING TASK - ABORTING before any execution'
            grep -iE '^:[^ ]*(assemble|package|bundle|apk|aar)' dryrun.txt
            exit 1
          fi
          echo 'Graph clean: no assemble/package/bundle/apk/aar tasks'

      - name: Compile (Kotlin only, no assemble/package)
        run: ./gradlew ":composeApp:${{ steps.discover.outputs.task }}" --no-daemon --console=plain
